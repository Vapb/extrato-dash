<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Extrato</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,400&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="page">

  <header>
    <div class="header-left">
      <h1>Extrato de <strong id="titular-name"></strong></h1>
      <span class="period-badge" id="period-badge"></span>
    </div>
  </header>

  <div class="summary" id="summary"></div>

  <div class="chart-section">
    <div class="section-title">Gastos por categoria</div>
    <div style="position:relative;width:100%;height:260px">
      <canvas id="catChart" role="img" aria-label="Gráfico de barras com total de gastos por categoria"></canvas>
    </div>
    <div class="chart-legend" id="chart-legend"></div>
  </div>

  <div class="controls">
    <span class="controls-label">Pessoa</span>
    <div id="pessoas"></div>
  </div>

  <div class="controls">
    <span class="controls-label">Mês</span>
    <div id="months"></div>
  </div>

  <div class="controls">
    <span class="controls-label">Filtrar</span>
    <div class="filters" id="filters"></div>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th data-col="data">Data</th>
          <th data-col="simpl">Nome Simplificado</th>
          <th data-col="orig">Nome Original (Extrato)</th>
          <th data-col="cat">Categoria</th>
          <th data-col="val" style="text-align:right">Valor (R$)</th>
          <th data-col="origem">Origem</th>
        </tr>
      </thead>
      <tbody id="tbody">
        <tr><td colspan="6" class="empty">Carregando…</td></tr>
      </tbody>
    </table>
  </div>

  <footer id="footer-period"></footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
